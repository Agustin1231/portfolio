# ==========================================
# nginx del portafolio (Coolify, build pack estático)
# Se pega en Coolify → la aplicación → Configuration → General → "Custom Nginx Configuration".
# Coolify la monta como /etc/nginx/conf.d/default.conf, que nginx incluye dentro de http { }:
# por eso los map { } van fuera del server { }.
# Probada con nginx:alpine (ver deploy/README.md). Cambios respecto de la config por defecto de Coolify:
#   - caché larga para lo que tiene la versión en el nombre (vendor/, fonts/) y 7 días para imágenes
#   - cabeceras de seguridad (HSTS, nosniff, Referrer-Policy, frame-ancestors)
#   - 301 de verdad para las URLs viejas (/proyecto?id=, /guia?id=, *.dc.html)
#   - 404 propia (/404.html) y no se sirven los archivos internos del repo
#   - X-Robots-Tag noindex para el material de clientes (también cubre el PDF, que no lleva <meta>)
# ==========================================

# Cache-Control según la ruta. Lo que no está aquí (HTML, JS sin versión, sitemap) se revalida
# siempre con ETag: un 304 es barato y así un cambio se ve apenas se despliega.
map $uri $ap_cache {
    default                                       "no-cache";
    ~^/vendor/                                    "public, max-age=31536000, immutable";
    ~^/fonts/.+\.woff2$                           "public, max-age=31536000, immutable";
    ~\.(?:png|jpe?g|webp|avif|gif|svg|ico)$       "public, max-age=604800, stale-while-revalidate=86400";
    ~\.pdf$                                       "public, max-age=86400";
    /api/metricas                                 "public, max-age=60";
}

# Copia de las métricas del tracker (ver location = /api/metricas). Vive dentro del contenedor:
# se pierde en cada despliegue y se vuelve a llenar con la primera visita.
proxy_cache_path /var/cache/nginx/metricas levels=1 keys_zone=metricas:1m max_size=5m inactive=7d use_temp_path=off;

# Material de clientes y cuestionarios: fuera de los buscadores (la cabecera vale también para el PDF).
map $uri $ap_robots {
    default                                                "";
    ~^/(?:expedientes|innaltech|levantamiento|clinica10)/  "noindex, nofollow";
}

# URLs viejas con ?id= hacia la página estática. Con &preview=1 se sigue sirviendo la versión dinámica.
map "$arg_id:$arg_preview" $ap_proyecto {
    "~^(?<ap_pid>[a-z0-9-]+):$"   /proyectos/$ap_pid.html;
    default                    "";
}
map "$arg_id:$arg_preview" $ap_guia {
    "~^(?<ap_gid>[a-z0-9-]+):$"   /guias/$ap_gid.html;
    default                    "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/xml;
    # Detrás de Traefik nginx ve http; con redirecciones relativas el navegador se queda en https.
    absolute_redirect off;

    # Hoy comprime Traefik (la opción "Gzip compression" de Coolify), y lo hace también con imágenes
    # y PDF, que ya vienen comprimidos. Si se apaga esa opción, descomentar para que nginx comprima
    # solo el texto (ver deploy/README.md):
    # gzip on;
    # gzip_vary on;
    # gzip_comp_level 6;
    # gzip_min_length 1024;
    # gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    add_header Cache-Control $ap_cache always;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Robots-Tag $ap_robots always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # El micrófono no se bloquea: los cuestionarios graban respuestas de audio.
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

    location / {
        # $uri.html antes que los directorios: /proyectos sirve proyectos.html aunque exista proyectos/
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- métricas del tracker ----
    # El webhook de n8n tarda ~2 s y ejecuta el flujo completo en cada llamada. nginx lo pide como
    # mucho una vez cada 10 minutos y sirve la copia al resto; al vencer, la sigue sirviendo mientras
    # la renueva en segundo plano, y si n8n falla sigue con la última buena.
    # El host va en una variable para que nginx arranque aunque el DNS no responda en ese momento.
    location = /api/metricas {
        # Solo lectura: cualquier otro método se saltaría la copia y ejecutaría el flujo.
        limit_except GET { deny all; }
        resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $metricas_upstream "https://n8n.agustinynatalia.site/webhook/metricas-automatizaciones";
        proxy_pass $metricas_upstream;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host n8n.agustinynatalia.site;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name n8n.agustinynatalia.site;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache metricas;
        proxy_cache_key "metricas";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Alt-Svc;
        proxy_hide_header CF-Ray;
        proxy_hide_header CF-Cache-Status;
        proxy_hide_header NEL;
        proxy_hide_header Report-To;
        proxy_hide_header Server-Timing;
    }

    # ---- redirecciones permanentes de URLs viejas ----
    location = /proyecto      { if ($ap_proyecto) { return 301 $ap_proyecto; } try_files /proyecto.html =404; }
    location = /proyecto.html { if ($ap_proyecto) { return 301 $ap_proyecto; } try_files /proyecto.html =404; }
    location = /guia          { if ($ap_guia)     { return 301 $ap_guia; }     try_files /guia.html =404; }
    location = /guia.html     { if ($ap_guia)     { return 301 $ap_guia; }     try_files /guia.html =404; }
    location = /Portafolio.dc.html { return 301 /; }
    location = /Proyectos.dc.html  { return 301 /proyectos; }
    location = /Metricas.dc.html   { return 301 /metricas; }
    location = /Proyecto.dc.html   { if ($ap_proyecto) { return 301 $ap_proyecto; } return 301 /proyectos; }
    location = /Guia.dc.html       { if ($ap_guia)     { return 301 $ap_guia; }     return 301 /guias/; }
    location = /proyectos/         { return 301 /proyectos; }

    # ---- archivos del repo que no son parte del sitio ----
    location ~ ^/(?:build-[a-z]+\.js|README\.md|deploy/|scripts/) { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
}
